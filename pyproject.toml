[project]
name = "remotemobprogramming"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steven Collins", email = "happylomin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
remotemobprogramming = "remotemobprogramming:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.pytest-watcher]
runner = "uv"
runner_args = ["run", "pytest", "-x", "--ff"]
patterns = ["*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
