[project]
name = "remotemobprogramming"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Steven Collins", email = "happylomin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
remotemobprogramming = "remotemobprogramming:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.16.1",
]

[tool.mob]
# Branch that `inv mob.start` opens a root session from. Falls back to
# origin/HEAD, then local main, then the current branch.
base = "main"
# Namespace for session branches. Backups live under mob-backup/ so they never
# show up as sessions.
prefix = "mob/"
remote = "origin"
notes_ref = "mob"
# Where `inv leetcode` scaffolds an exercise: sessions/<session name>/.
sessions_dir = "sessions"
# Model used to generate exercises.
model = "sonnet"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# tasks.py lives at the root and is not part of the package, but its argument
# wiring is worth testing. It is also what lets a scaffolded exercise import
# itself as sessions.<name>.main.
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "complexity: measures how a solution scales; slow, and excluded from the watch loop",
]

[tool.pytest-watcher]
runner = "uv"
runner_args = ["run", "pytest", "-x", "--ff"]
patterns = ["*.py"]

[tool.ruff]
line-length = 100
# Exercises are generated, and the solution inside them belongs to whoever is
# solving it. `inv test.self` checks this tool, not the mob's work in progress.
extend-exclude = ["sessions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
